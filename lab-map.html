<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leonida Drive — map lab</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f16; color: #eee; font: 13px/1.3 Oswald, system-ui, sans-serif; }
    #map { position: fixed; inset: 0; }
    #radar { position: fixed; left: 28px; bottom: 26px; width: 300px; height: 190px; border-radius: 16px; z-index: 5;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.55), 0 8px 24px rgba(0, 0, 0, 0.5); }
    #bar { position: fixed; z-index: 10; left: 50%; top: 8px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      max-width: 92vw; padding: 6px 10px; background: rgba(10, 12, 18, 0.85); border: 1px solid #333; border-radius: 10px; }
    #bar button, #bar select { font: inherit; background: #222; color: #eee; border: 1px solid #444; padding: 3px 8px; border-radius: 6px; cursor: pointer; }
    #bar button.on { background: #ff3fa4; border-color: #ff3fa4; }
    #bar input[type=range] { width: 90px; accent-color: #ff3fa4; }
    #stats { position: fixed; z-index: 10; right: 8px; top: 64px; padding: 8px 10px; background: rgba(10, 12, 18, 0.85); border: 1px solid #333; border-radius: 8px;
      font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre; color: #9f9; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <canvas id="radar"></canvas>
  <div id="bar"></div>
  <div id="stats"></div>
  <script type="module" src="/src/map/lab-map.js"></script>
</body>
</html>
