# nginx in front of the multiplayer server: TLS termination + WebSocket upgrade on /ws (also /health, /metrics).
# The server listens on 127.0.0.1:8787 and runs with TRUST_PROXY=1 (client IP from X-Real-IP for per-IP limits).
# Main context for many sockets: worker_rlimit_nofile 200000; events { worker_connections 65535; }
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 443 ssl http2;
  server_name mp.leonida-drive.io;
  ssl_certificate     /etc/letsencrypt/live/mp.leonida-drive.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mp.leonida-drive.io/privkey.pem;
  # privacy: no access log (it would store full client IPs); the error log only at 'crit' (no per-client lines)
  access_log off;
  error_log /var/log/nginx/leonida-mp.error.log crit;

  location /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;          # the server checks the Origin allowlist (ALLOWED_ORIGINS)
    proxy_set_header X-Real-IP $remote_addr;       # per-IP connection limits (TRUST_PROXY=1)
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;                       # the server pings idle sockets every ~30 s
    proxy_send_timeout 120s;
    proxy_buffering off;
    tcp_nodelay on;
  }
  location = /health { proxy_pass http://127.0.0.1:8787; }
  location = /status { proxy_pass http://127.0.0.1:8787; } # start-screen player count (CORS + cache headers from the server)
  location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://127.0.0.1:8787; }
  location / { return 404; }
}
